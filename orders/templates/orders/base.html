<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pet Adoption Shop{% endblock %}</title>
  <style>
    :root { --orange:#f57224; --dark:#212121; --soft:#f5f5f5; --line:#e5e5e5; }
    body{font-family:Arial,sans-serif;margin:0;background:var(--soft);color:var(--dark)}
    .top{background:#fff;padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .brand{font-size:24px;font-weight:700;color:var(--orange);text-decoration:none}
    .actions a{margin-left:16px;text-decoration:none;color:#333;font-weight:600}
    .container{max-width:1180px;margin:20px auto;padding:0 14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
    .card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .card img{width:100%;height:180px;object-fit:cover;background:#fafafa}
    .p16{padding:16px}
    .muted{color:#666;font-size:14px}
    .price{font-size:22px;color:var(--orange);font-weight:700}
    .btn{background:var(--orange);color:#fff;border:none;padding:10px 12px;border-radius:6px;cursor:pointer}
    .btn-outline{background:#fff;border:1px solid var(--orange);color:var(--orange)}
    .row{display:flex;gap:10px;align-items:center}
    .row-between{display:flex;justify-content:space-between;align-items:center}
    .alert{padding:10px;background:#fff3cd;border:1px solid #ffeeba;border-radius:8px;margin-bottom:12px}
    input,textarea{padding:9px;border:1px solid #ccc;border-radius:6px;width:100%}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}
  </style>
</head>
<body>
  <header class="top">
    <a href="{% url 'orders:catalog' %}" class="brand">PetBazaar</a>
    <nav class="actions">
      <a href="{% url 'orders:catalog' %}">Shop</a>
      <a href="{% url 'orders:dashboard' %}">Dashboard</a>
      <a href="{% url 'orders:cart_detail' %}">Cart ({{ cart_count|default:0 }})</a>
    </nav>
  </header>
  <main class="container">
    {% if messages %}
      {% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
