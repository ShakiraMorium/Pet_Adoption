<!doctype html>
<html>
<head><title>Order Placed</title></head>
<body>
  <h1>Thank you! Order placed.</h1>
  <p>Order ID: {{ order.id }}</p>
  <p>Status: {{ order.status }}</p>
  <p>Total: ${{ order.total_price }}</p>
  <h3>Items</h3>
  <ul>
    {% for item in order.items.all %}
      <li>{{ item.pet.name }} × {{ item.quantity }} = ${{ item.total_price }}</li>
    {% endfor %}
  </ul>
  <a href="{% url 'orders:catalog' %}">Back to catalog</a>
</body>
</html>
