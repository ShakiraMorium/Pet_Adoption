{% extends 'core/base.html' %}

{% block content %}

<h2 class="text-3xl font-bold mb-6">🐾 Available Pets</h2>

<div class="grid md:grid-cols-3 gap-6">

{% for pet in pets %}
    <div class="glass p-4 hover:scale-105 hover:shadow-2xl transition duration-300">
        
        <a href="{% url 'pet_detail' pet.id %}">
            <img src="{{ pet.image.url }}" 
                 class="h-48 w-full object-cover rounded-lg">
        </a>

        <h3 class="text-xl font-semibold mt-3">{{ pet.name }}</h3>

        <p class="text-gray-600 text-sm">
            {{ pet.description|truncatewords:10 }}
        </p>

        <div class="flex justify-between items-center mt-4">
            <span class="text-green-600 font-bold text-lg">
                ${{ pet.price }}
            </span>

            <a href="{% url 'add_to_cart' pet.id %}" 
               class="bg-green-500 text-white px-3 py-1 rounded-full hover:bg-green-600 transition">
                Add
            </a>
        </div>

    </div>
{% endfor %}

</div>

{% endblock %}
